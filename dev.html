<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>r_planet — test corpus</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1a1a22;
        --line: #d7d7df;
        --bg: #f6f6f2;
        --accent: #3a5bd9;
        --bad: #c0392b;
        --muted: #6b6b78;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font: 14px/1.5 system-ui, sans-serif;
        color: var(--ink);
        background: var(--bg);
        padding: 24px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 20px;
      }
      .notice {
        background: #fff4f4;
        border: 1px solid #f0c4c4;
        color: var(--bad);
        padding: 16px;
        border-radius: 8px;
      }
      .bar {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .pill {
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 999px;
        padding: 4px 12px;
        font-size: 12px;
      }
      .pill.ok {
        border-color: #bfe3c4;
        background: #f1fbf2;
      }
      .pill.warn {
        border-color: #f0d9a8;
        background: #fffaf0;
      }
      button {
        font: inherit;
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button.danger {
        color: var(--bad);
        border-color: #e3bcbc;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 16px;
        margin: 16px 0 32px;
      }
      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .card h3 {
        margin: 0;
        font-size: 14px;
        font-family: ui-monospace, monospace;
      }
      .pad-wrap {
        display: flex;
        gap: 10px;
      }
      canvas.pad {
        width: 120px;
        height: 180px;
        border: 1px dashed var(--line);
        border-radius: 6px;
        background: #fff;
        touch-action: none;
        flex: none;
      }
      .fields {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
      }
      label {
        font-size: 11px;
        color: var(--muted);
      }
      textarea,
      input[type='text'],
      input[type='number'],
      select {
        font: inherit;
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 5px 7px;
        width: 100%;
      }
      textarea {
        resize: vertical;
        min-height: 44px;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .msg {
        font-size: 12px;
        min-height: 16px;
      }
      .msg.err {
        color: var(--bad);
      }
      .msg.ok {
        color: #2e7d32;
      }
      section.sim {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px;
      }
      section.sim h2 {
        margin: 0 0 10px;
        font-size: 16px;
      }
      .sim-controls {
        display: flex;
        gap: 14px;
        align-items: flex-end;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .sim-controls .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        width: 130px;
      }
      .report {
        font-family: ui-monospace, monospace;
        font-size: 12px;
        white-space: pre-wrap;
        background: #fafafa;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 12px;
        max-height: 360px;
        overflow: auto;
      }
      .stats {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .stat b {
        display: block;
        font-size: 18px;
      }
      .stat span {
        color: var(--muted);
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <h1>r_planet — test corpus</h1>
    <p class="sub">
      Author synthetic explorers, draw them by hand, then run a batch simulation. All token
      spend is bounded to an explicit run. Local dev only.
    </p>
    <div id="root"></div>
    <script type="module" src="/src/dev.ts"></script>
  </body>
</html>
