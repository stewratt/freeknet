<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>doodler</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #222;
    }
    #draw-phase {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #ffffff;
    }
    #draw-phase h1 {
      font-weight: 300;
      font-size: 20px;
      letter-spacing: 0.05em;
      margin: 0;
      color: #777;
    }
    #draw-phase .hint {
      font-size: 13px;
      color: #999;
      margin: 0;
    }
    #draw-canvas {
      border: 2px solid #222;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
      cursor: crosshair;
      touch-action: none;
      background: #ffffff;
    }
    #draw-controls {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }
    button {
      font: inherit;
      padding: 8px 18px;
      background: #fff;
      border: 1px solid #bbb;
      cursor: pointer;
      border-radius: 2px;
      color: #333;
    }
    button:hover { background: #f3f3f3; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    #game-phase {
      position: fixed;
      inset: 0;
      display: none;
    }
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #chat-bar {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: min(500px, 80vw);
      display: none;
    }
    #chat-bar input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ccc;
      background: rgba(255,255,255,0.9);
      font: inherit;
      outline: none;
      border-radius: 2px;
    }

    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      font-size: 12px;
      color: #888;
      pointer-events: none;
      display: none;
    }
    #hud .row { margin-bottom: 2px; }
  </style>
</head>
<body>
  <div id="draw-phase">
    <h1>draw yourself</h1>
    <p class="hint">one continuous line — click, draw, release</p>
    <canvas id="draw-canvas" width="500" height="750"></canvas>
    <div id="draw-controls">
      <button id="redraw-btn" disabled>redraw</button>
      <button id="enter-btn" disabled>enter world</button>
    </div>
  </div>

  <div id="game-phase">
    <canvas id="game-canvas"></canvas>
    <div id="hud">
      <div class="row">WASD move · right-drag rotate camera</div>
      <div class="row">T to chat · Enter to send · Esc to cancel</div>
    </div>
    <div id="chat-bar">
      <input id="chat-input" type="text" maxlength="120" placeholder="say something..." />
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
